# ------------------------------------------------------------------------------
# CI — the checks every push to `main`, pull request and merge-group run.
#
# Each job guards one thing; `ci-ok` aggregates them into the single status
# check that branch protection requires. The `justfile` mirrors these recipes
# for local runs. The `changes` job skips the build jobs when a change touches
# only documentation, and keeps a reduced set on pushes to `main` and release
# pull requests; formatting, spelling and the commit lint always run.
# ------------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_WARNINGS: deny
  RUST_BACKTRACE: 1

jobs:
  # Decides how much of the pipeline a run needs. `code` is false for a change
  # that touches only documentation (the site, the READMEs, the Markdown
  # guides): the build jobs are skipped and `ci-ok` still reports, so the
  # required check stays green. `full` is true for a pull request and a merge
  # group, the only places where content is seen before it becomes final; a
  # push to `main` repeats a pull request already run against an up-to-date
  # base, and a release pull request only bumps versions and the changelog,
  # so both keep the Linux build, the lints, the docs and the coverage that
  # feed the cache and Codecov, and skip the other platforms, the feature
  # powerset, the examples and the semver check. A merge group has no base to
  # diff against and always runs everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
      full: ${{ steps.decide.outputs.full }}
      os: ${{ steps.decide.outputs.os }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        if: github.event_name != 'merge_group'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - "crates/**"
              - "examples/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "deny.toml"
              - "clippy.toml"
              - "rustfmt.toml"
              - "rust-toolchain.toml"
              - ".taplo.toml"
              - "justfile"
              - ".github/workflows/**"
      - id: decide
        env:
          CODE: ${{ github.event_name == 'merge_group' || steps.filter.outputs.code == 'true' }}
          FULL: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-plz-')) }}
        run: |
          {
            echo "code=$CODE"
            echo "full=$FULL"
            if [ "$FULL" = "true" ]; then
              echo 'os=["ubuntu-latest", "macos-latest", "windows-latest"]'
            else
              echo 'os=["ubuntu-latest"]'
            fi
          } >> "$GITHUB_OUTPUT"

  # Guards formatting: `cargo fmt` for Rust and `taplo` for TOML.
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo
      - run: cargo fmt --all --check
      - run: taplo fmt --check

  # Guards the lint policy: clippy on every target with warnings as errors.
  clippy:
    name: Clippy
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Guards behaviour: the test suite and the doctests on all three platforms.
  test:
    name: Test (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --all-features --doc

  # Guards the documentation: builds with the docs.rs flags, warnings as errors.
  docs:
    name: Docs (docs.rs settings)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: --cfg docsrs -D warnings
      # rust-toolchain.toml pins the stable toolchain, which rejects the
      # `doc_cfg` feature; the nightly installed below must win. The date is
      # pinned because the engine's dependencies use unstable allocator APIs
      # that a newer nightly has already changed; bump it together with the
      # `turso` version.
      RUSTUP_TOOLCHAIN: nightly-2026-07-25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-25
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --all-features --no-deps

  # Guards the MSRV: compiles on exactly the `rust-version` from Cargo.toml.
  msrv:
    name: MSRV
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(awk -F'"' '/^rust-version/ {print $2; exit}' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-features --all-targets
        env:
          # rust-toolchain.toml would otherwise override the MSRV toolchain.
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}

  # Guards feature independence: every feature pair compiles on its own.
  features:
    name: Feature powerset
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: cargo hack check --workspace --feature-powerset --depth 2 --no-dev-deps

  # Guards the examples: each one is a separate workspace, formatted, linted
  # and tested on its own; the console example must also run to completion.
  examples:
    name: Examples
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            examples/basic
            examples/axum_example
            examples/actix_example
      - run: |
          for manifest in examples/*/Cargo.toml; do
            echo "::group::$manifest"
            cargo fmt --all --manifest-path "$manifest" -- --check
            cargo clippy --workspace --all-targets --manifest-path "$manifest" -- -D warnings
            cargo test --workspace --manifest-path "$manifest"
            echo "::endgroup::"
          done
          cargo run --manifest-path examples/basic/Cargo.toml

  # Guards the supply chain: advisories, licences, bans and sources (deny.toml).
  deny:
    name: cargo-deny
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Guards spelling in sources and docs (typos.toml).
  typos:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@master

  # Guards the history: every commit of a pull request must be a Conventional
  # Commit (committed.toml), since release-plz derives versions from them.
  commits:
    name: Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: crate-ci/committed@v1.1.11
        with:
          args: -vv --no-merge-commit
          # The default range walks `HEAD~N` through the merge commit's first
          # parent, which is `main`, so it falls off the end of a short history.
          commits: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  # Guards the public API: flags semver-breaking changes on pull requests.
  semver:
    name: Semver
    needs: [changes]
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    steps:
      - uses: actions/checkout@v7
      # The baseline is the version published on crates.io, which does not
      # exist before the first release; the check is skipped until then
      # rather than reported as a failure.
      - id: baseline
        run: |
          if curl --silent --fail --output /dev/null https://crates.io/api/v1/crates/turso-orm; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.baseline.outputs.published == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2

  # Reports test coverage to Codecov; informational, never blocks a merge.
  coverage:
    name: Coverage
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --workspace --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Single required status check for branch protection — green only when the
  # detection succeeded and every job it needs either succeeded or was skipped
  # because the change touched no code.
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, fmt, clippy, test, docs, msrv, features, examples, deny, typos]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | jq -e '
            .changes.result == "success"
            and (to_entries | all(.value.result == "success" or .value.result == "skipped"))'
