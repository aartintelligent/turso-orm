# ------------------------------------------------------------------------------
# Release-plz — releases on every push to `main`, driven by release-plz.toml.
#
# Two jobs run in sequence of intent: `release` publishes whatever a merged
# release PR bumped, `release-pr` then opens or refreshes the next release PR.
# Both need `CARGO_REGISTRY_TOKEN` for crates.io.
# ------------------------------------------------------------------------------

name: Release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Publishes the crates to crates.io and creates the git tag and GitHub
  # release when a release PR has just been merged.
  release-plz-release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Opens or updates the release PR with version bumps and changelogs; never
  # cancelled mid-run so a half-written PR is not left behind.
  release-plz-pr:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
