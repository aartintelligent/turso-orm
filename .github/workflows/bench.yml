# ------------------------------------------------------------------------------
# Benchmarks — measures the ORM against the raw client and opens a pull request
# with the report for the locked `turso` version.
#
# Runs when a version of the ORM is published, so that the report always
# states the measurements of the released code, and by hand from the Actions
# tab when the `turso` version changes between releases. Every release creates
# one GitHub release per crate; only the `turso-orm` one starts the job. The
# benchmarks are never part of CI: a shared runner is too noisy to compare two
# commits of this repository, but the ORM-to-raw ratio survives the noise and
# is what the report records (see docs/performance/explain.md). The report
# lands on a `bench/turso-<version>` branch and in a pull request opened with
# `RELEASE_PLZ_TOKEN`, like the release PR, so that it receives the `CI OK`
# check the protected `main` branch requires; merging it publishes the page.
# ------------------------------------------------------------------------------

name: Benchmarks

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Runs every group, writes the version page and its nav entry, and opens or refreshes
  # the pull request for that `turso` version.
  report:
    name: Report
    # The releases of the other four crates carry the same code; one run per version.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'turso-orm-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo bench -p benches
      - run: cargo run -p benches --bin report
      - id: turso
        run: echo "version=$(awk -F'"' '/^name = "turso"$/ {getline; print $2; exit}' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          VERSION: ${{ steps.turso.outputs.version }}
        run: |
          branch="bench/turso-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/performance zensical.toml
          if git diff --cached --quiet; then
            echo "the report for turso $VERSION is unchanged"
            exit 0
          fi
          git commit -q -m "docs(workspace): record the benchmark report for turso $VERSION" \
            -m "Generated by the Benchmarks workflow on a GitHub-hosted runner; the ORM-to-raw ratios are the comparable numbers, the absolute times belong to that runner."
          git push --force --set-upstream origin "$branch"
          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" = "0" ]; then
            gh pr create --base main --head "$branch" \
              --title "docs(workspace): record the benchmark report for turso $VERSION" \
              --body "Report generated by the Benchmarks workflow for turso $VERSION. The ORM-to-raw ratios are the comparable numbers; the absolute times belong to the GitHub-hosted runner."
          fi
