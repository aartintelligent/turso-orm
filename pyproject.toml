# ------------------------------------------------------------------------------
# pyproject — the documentation site toolchain only.
#
# The crates are pure Rust; Python is here for Zensical, the static site
# generator by the Material for MkDocs team, which renders `docs/` into the
# site published on GitHub Pages. `uv` keeps the environment local to the
# repository: `uv run --group docs zensical serve` (or `just docs-serve`)
# needs nothing installed globally. `package = false` tells uv there is no
# Python package to build here.
# ------------------------------------------------------------------------------

[project]
name            = "turso-orm-docs"
version         = "0.0.0"
description     = "Documentation site of turso-orm"
requires-python = ">=3.12"

[dependency-groups]
docs = [
    "zensical>=0.0.67",
]

[tool.uv]
package = false
