# ------------------------------------------------------------------------------
# actix_example — a JSON REST API on actix-web backed by turso-orm.
#
# A separate workspace with three members: `entity` (the models), `migration`
# (the schema history and a tiny CLI) and `api` (the HTTP layer and the
# service functions it calls). This root package is only the binary that
# starts the server.
# ------------------------------------------------------------------------------

[workspace]
members  = [".", "api", "entity", "migration"]
resolver = "3"

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.94"
publish      = false

# Every member depends on the ORM through these entries. The `path` points at
# the in-repository crates; remove it in your own project.
[workspace.dependencies]
turso-orm           = { version = "0.1", path = "../../crates/turso-orm" }
turso-orm-migration = { version = "0.1", path = "../../crates/turso-orm-migration" }

[package]
name                   = "turso-orm-actix-example"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true

[dependencies]
actix-example-api = { path = "api" }
