# ------------------------------------------------------------------------------
# basic — a standalone example exercising the entity API end to end.
#
# A separate workspace, so that the example resolves its own dependency graph
# and the root workspace stays limited to the published crates. The entities
# come from `examples/common`, shared by every example; the `path` dependency
# on the ORM points at the in-repository crate and would be a plain version
# in your own project.
# ------------------------------------------------------------------------------

[workspace]

[package]
name         = "turso-orm-example-basic"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.94"
publish      = false

[dependencies]
# The agent runtime schema shared by the examples.
entity = { path = "../common/entity" }
# Row streaming in `query.rs` goes through `TryStreamExt`.
futures-util = "0.3"
# The JSON columns (`capabilities`, `tool_calls`) use `serde_json::Value`.
serde_json = "1"
tokio      = { version = "1", features = ["macros", "rt-multi-thread"] }
turso-orm  = { version = "0.1", path = "../../crates/turso-orm" }
