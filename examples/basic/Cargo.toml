# ------------------------------------------------------------------------------
# basic — a JSON API on axum that exercises the entity API end to end.
#
# A separate workspace, so that the example resolves its own dependency graph
# and the root workspace stays limited to the published crates. The entities
# and the migrations come from `examples/common`, shared by every example;
# the `path` dependency on the ORM points at the in-repository crate and
# would be a plain version in your own project.
#
# One crate, four layers: `dto` describes what goes in and out as JSON,
# `service` talks to the database through the ORM and knows nothing of HTTP,
# `handler` binds the two under `router`, and `error` maps a `DbErr` to a
# status. `settings` reads the configuration from defaults and environment
# variables, `db` opens the database in the mode they name, `state` carries
# the pool and the settings into the handlers, `telemetry` sets up tracing.
# The documentation site includes the services, the DTOs, the error mapping,
# a handler and the connection block by block; `tests/api.rs` drives the
# router in memory and is what CI runs.
# ------------------------------------------------------------------------------

[workspace]

[package]
name         = "turso-orm-example-basic"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.94"
publish      = false

# The library is what the tests and the binary share; its short name is what
# `tests/api.rs` imports.
[lib]
name = "basic"

[dependencies]
axum = "0.8"
# The settings: a typed struct with defaults, overridden by `BASIC__*`
# environment variables. No file formats, hence no default features.
config = { version = "0.15", default-features = false }
# The agent runtime schema shared by the examples, and its migrations.
entity    = { path = "../common/entity" }
migration = { path = "../common/migration" }
# Row streaming in `service/agents.rs` goes through `TryStreamExt`.
futures-util = "0.3"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
# One span per request, on top of the statement logs the driver emits.
tower-http         = { version = "0.6", features = ["trace"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `sync` and `serverless` let the settings open a Turso Cloud replica or the
# HTTP mode, next to the in-memory and file modes.
turso-orm = { version = "0.1", path = "../../crates/turso-orm", features = ["sync", "serverless"] }

[dev-dependencies]
# `tests/api.rs` calls the router with `oneshot` and reads the bodies back.
http-body-util = "0.1"
tower          = { version = "0.5", features = ["util"] }
