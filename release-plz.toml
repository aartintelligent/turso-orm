# ------------------------------------------------------------------------------
# release-plz — automated release PRs, changelogs, tags and crates.io publishes.
#
# All five crates share the `turso-orm` version group, so one release bumps
# them together and every tag carries the same version. They also share one
# changelog, `CHANGELOG.md` at the root, written on behalf of `turso-orm` and
# fed with the commits of every crate through `changelog_include`: a crate
# with no commit of its own in a release would otherwise get its header
# re-inserted at every bump. Entries come from conventional commits: `feat`,
# `fix`, `perf`, `doc`, `refactor`, `deprecate` and `revert` are grouped under
# Keep a Changelog headings; `chore`, `ci`, `build`, `test` and `style` are
# skipped. Reference: https://release-plz.dev/docs/config and
# https://release-plz.dev/docs/extra/single-changelog
# ------------------------------------------------------------------------------

[workspace]
# Off by default; only `turso-orm` writes the shared changelog, see below.
changelog_update    = false
dependencies_update = false
git_release_enable  = true
git_tag_enable      = true
pr_labels           = ["release"]
publish             = true
release_always      = false
semver_check        = true

# Changelog preamble and the commit-message to section mapping.
[changelog]
header = """# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^doc", group = "Documentation" },
    { message = "^refactor", group = "Changed" },
    { message = "^deprecate", group = "Deprecated" },
    { message = "^(chore|ci|build|test|style)", skip = true },
    { message = "^revert", group = "Reverted" },
    { body = ".*security", group = "Security" },
]

[[package]]
name          = "turso-sql"
version_group = "turso-orm"

[[package]]
name          = "turso-orm-driver"
version_group = "turso-orm"

[[package]]
name          = "turso-orm-macros"
version_group = "turso-orm"

# The crate that owns the shared changelog: its own commits plus those of the
# four others, so that one section per version covers the whole workspace.
[[package]]
name              = "turso-orm"
changelog_path    = "CHANGELOG.md"
changelog_update  = true
changelog_include = ["turso-sql", "turso-orm-driver", "turso-orm-macros", "turso-orm-migration"]
version_group     = "turso-orm"

[[package]]
name          = "turso-orm-migration"
version_group = "turso-orm"
