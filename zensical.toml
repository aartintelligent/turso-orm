# ------------------------------------------------------------------------------
# zensical — the documentation site.
#
# Zensical, by the Material for MkDocs team, renders `docs/` with the Material
# theme (`variant = "modern"`, or `"classic"` for the historical look). `just
# docs-serve` previews the site and the `docs` workflow publishes it to GitHub
# Pages. Code blocks are pulled from the compiled examples through
# `pymdownx.snippets` markers, so a page can never show code that does not
# build. `strict = true` turns a broken link or a missing snippet into a build
# failure. Search is built in and needs no declaration.
# ------------------------------------------------------------------------------

[project]
site_name = "Turso ORM"
site_description = "An async ORM dedicated to the Turso database, with a typed entity API."
site_url = "https://aartintelligent.github.io/turso-orm/"
repo_url = "https://github.com/aartintelligent/turso-orm"
repo_name = "aartintelligent/turso-orm"
edit_uri = "edit/main/docs/"
copyright = """
Copyright &copy; Aurelien Andre. MIT OR Apache-2.0. turso-orm is an independent \
project and is not affiliated with or endorsed by \
<a href="https://turso.tech/">Turso</a>."""
strict = true

# `home.css` is not listed: `overrides/home.html` links it on the home page
# only, the way the theme's own home page loads its stylesheet.
extra_css = [
    "assets/stylesheets/brand.css",
    "assets/stylesheets/extra.css",
]

nav = [
    { "Home" = "index.md" },
    { "Overview" = [
        { "Why" = "overview/why.md" },
        { "Features" = "overview/features.md" },
        { "Use cases" = "overview/use-cases.md" },
        { "Design" = "overview/design.md" },
        { "Compatibility" = "overview/compatibility.md" },
        { "Roadmap" = "overview/roadmap.md" },
    ] },
    { "Documentation" = [
        { "Quickstart" = "guide/quickstart.md" },
        { "Database" = "guide/database.md" },
        { "Entities" = "guide/entities.md" },
        { "Queries" = "guide/queries.md" },
        { "Relations" = "guide/relations.md" },
        { "Transactions" = "guide/transactions.md" },
        { "Migrations" = "guide/migrations.md" },
        { "Observability" = "guide/observability.md" },
    ] },
    { "Performance" = [
        { "Explain" = "performance/explain.md" },
        # One page per `turso` version, newest first; `benches/src/bin/report.rs`
        # inserts the next entry below this comment, never edit the list by hand.
        # report: versions
        { "Turso 0.8.3" = "performance/turso-0.8.3.md" },
    ] },
    { "Project" = [
        { "About" = "project/about.md" },
        { "Contributing" = "project/contributing.md" },
        { "Community" = "project/community.md" },
        { "License" = "project/license.md" },
    ] },
]

[project.theme]
# `modern` is Zensical's refreshed look; `classic` keeps Material for MkDocs's.
variant    = "modern"
custom_dir = "overrides"
language   = "en"
# The Turso logomark from the brand kit, as header logo and favicon.
logo = "assets/turso/logomark-illustrated.svg"
favicon = "assets/turso/logomark-illustrated.svg"
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.tabs.link",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "search.suggest",
    "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# A single dark palette, no toggle: the site follows turso.tech, which is dark
# only. `custom` hands the colors to assets/stylesheets/brand.css.
[project.theme.palette]
scheme  = "slate"
primary = "custom"
accent  = "custom"

# The same type as turso.tech.
[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.markdown_extensions]
abbr                                   = {}
admonition                             = {}
attr_list                              = {}
def_list                               = {}
footnotes                              = {}
md_in_html                             = {}
tables                                 = {}
toc.permalink                          = true
pymdownx.details                       = {}
pymdownx.emoji.emoji_index             = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator         = "zensical.extensions.emoji.to_svg"
pymdownx.highlight.anchor_linenums     = true
pymdownx.highlight.line_spans          = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite                  = {}
pymdownx.keys                          = {}
# `base_path` is the repository root so pages include code from `examples/`
# and `crates/`; `check_paths` makes a missing file or marker an error.
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true

[project.extra]
generator = false
# The `turso` version the home page hero shows. `benches/src/bin/report.rs`
# keeps it equal to the version resolved in Cargo.lock; never edit it by hand.
turso_version = "0.8.3"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/aartintelligent/turso-orm"
name = "turso-orm on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/rust"
link = "https://crates.io/crates/turso-orm"
name = "turso-orm on crates.io"

[[project.extra.social]]
icon = "material/database-outline"
link = "https://turso.tech/"
name = "Turso"
